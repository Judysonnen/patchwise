[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "patchwise"
version = "0.0.1"
description = "tolerant apply_patch for llm-generated diffs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["apply_patch*", "harness*"]
